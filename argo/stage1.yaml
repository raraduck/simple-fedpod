apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fedpod-stage1-
  namespace: dwnkim
spec:
  entrypoint: stage1
  serviceAccountName: default
  podGC:
    strategy: OnPodCompletion

  # ── 공통 파라미터 ──────────────────────────────────────────────────────────
  arguments:
    parameters:
    - name: image
      value: "192.168.0.80:30002/dwnkim/argo-fedpod:v0.2"
    - name: data-path
      value: "/data/fets128/trainval"
    - name: split-csv
      value: "/experiments/fets/partition2/fets_split.csv"
    - name: ckpt-root
      value: "/checkpoints"
    - name: epochs
      value: "3"

  volumes:
  - name: app-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/scripts
      readOnly: true
  - name: data-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/data
      readOnly: true
  - name: experiments-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/experiments
      readOnly: true
  - name: checkpoints-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/checkpoints
      readOnly: false
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

  templates:

  # ── DAG ───────────────────────────────────────────────────────────────────
  - name: stage1
    dag:
      tasks:
      - name: train
        template: train-job
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: job-name
            value: "{{item.job-name}}"
        withItems:
        - { partition: "1",  job-name: "stage1-p01" }
        - { partition: "2",  job-name: "stage1-p02" }

  # ── Train Job 템플릿 ───────────────────────────────────────────────────────
  - name: train-job
    inputs:
      parameters:
      - name: partition
      - name: job-name
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    nodeSelector:
      nvidia.com/gpu.model: rtx3090
    container:
      image: "{{workflow.parameters.image}}"
      args:
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "-c"
      - "{{workflow.parameters.split-csv}}"
      - "-P"
      - "{{inputs.parameters.partition}}"
      - "-J"
      - "{{inputs.parameters.job-name}}"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "--epochs"
      - "{{workflow.parameters.epochs}}"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
      - name: dshm
        mountPath: /dev/shm
