apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fedpod-stage1-
  namespace: dwnkim
spec:
  entrypoint: stage1
  serviceAccountName: default

  volumes:
  - name: app-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/scripts
      readOnly: true
  - name: data-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/data
      readOnly: true
  - name: experiments-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/experiments
      readOnly: true
  - name: checkpoints-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/checkpoints
      readOnly: false
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

  templates:
  - name: stage1
    dag:
      tasks:
      - name: train-partition-1
        template: train
        arguments:
          parameters:
          - name: partition
            value: "1"
          - name: job
            value: "partition1"
      - name: train-partition-2
        template: train
        arguments:
          parameters:
          - name: partition
            value: "2"
          - name: job
            value: "partition2"

  - name: train
    inputs:
      parameters:
      - name: partition
      - name: job
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    nodeSelector:
      nvidia.com/gpu.model: rtx3090
    container:
      image: 192.168.0.80:30002/dwnkim/argo-fedpod:v0.2
      args:
      - "-D"
      - "/data/fets128/trainval"
      - "-c"
      - "/experiments/fets/partition2/fets_split.csv"
      - "-P"
      - "{{inputs.parameters.partition}}"
      - "--ckpt-root"
      - "/checkpoints"
      - "-J"
      - "{{inputs.parameters.job}}"
      - "--epochs"
      - "3"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
      - name: dshm
        mountPath: /dev/shm
