        dependencies: [dry-run]
        arguments:
          parameters:
          - name: split-csv
            value: "{{tasks.dry-run.outputs.parameters.next-split-csv}}"
          - name: round
            value: "{{tasks.dry-run.outputs.parameters.next-round}}"
          - name: init-ckpt
            value: "{{tasks.dry-run.outputs.parameters.next-init-ckpt}}"

      - name: agg-r0
        template: agg-job
        dependencies: [train-r0]
        arguments:
          parameters:
          - name: split-csv
            value: "{{tasks.dry-run.outputs.parameters.next-split-csv}}"
          - name: round
            value: "{{tasks.dry-run.outputs.parameters.next-round}}"

      # ── Round 1 ───────────────────────────────────────────────────────────
