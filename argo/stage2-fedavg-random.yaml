  # ── Dry-run Job (pool+entropy, GPU 필요) ──────────────────────────────────
  - name: dry-run-job
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu.model
              operator: In
              values:
              - rtx3090
              - rtx4090
    container:
      image: "{{workflow.parameters.image}}"
      command: ["python3", "agg.py"]
      args:
      - "--dry-run"
      - "-J"
      - "{{workflow.parameters.job}}"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "-c"
      - "/experiments/fets/partition2/fets_split.csv"
      - "--sampling-rate"
      - "1.0"
      - "--sampling-mode"
      - "pool"
      - "--selection"
      - "{{workflow.parameters.selection}}"
      - "--in-ch"
      - "5"
      - "--out-classes"
      - "3"
      - "--committee-job"
      - "{{workflow.parameters.committee-job}}"
      - "--committee-rounds"
      - "{{workflow.parameters.committee-rounds}}"
      - "--committee-round"
      - "{{workflow.parameters.committee-round}}"
      - "--committee-partitions"
      - "{{workflow.parameters.committee-partitions}}"
      - "--committee-in-ch"
      - "4"
      - "--committee-out-classes"
      - "1"
      - "--committee-chan"
      - "[t1,t1ce,t2,flair]"
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "--gpu"
      - "1"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints

  # ── Eval Job (generalization — agg.pt 를 모든 기관 val 에 평가) ──────────
  - name: eval-job
    inputs:
      parameters:
      - name: split-csv
      - name: round
      - name: init-ckpt
    metadata:
