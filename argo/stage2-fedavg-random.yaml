apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fedpod-stage2-
  namespace: dwnkim
spec:
  entrypoint: stage2
  serviceAccountName: default
  podGC:
    strategy: OnPodCompletion

  # ── 공통 파라미터 ──────────────────────────────────────────────────────────
  arguments:
    parameters:
    - name: image
      value: "192.168.0.80:30002/dwnkim/argo-fedpod:v0.3"
    - name: job
      value: "stage2"
    - name: committee-job
      value: "stage1"
    - name: committee-rounds
      value: "5"
    - name: committee-round
      value: "4"
    - name: committee-partitions
      value: "1,2,3,10,22,24,25,26,28"
    - name: data-path
      value: "/data/fets128/trainval"
    - name: ckpt-root
      value: "/checkpoints"
    - name: runs-root
      value: "/runs"
    - name: selection
      value: "entropy"
    - name: agg-sampling-mode
      value: "static"

  volumes:
  - name: app-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/scripts
      readOnly: true
  - name: data-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/data
      readOnly: true
  - name: experiments-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/experiments
      readOnly: true
  - name: checkpoints-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/checkpoints
      readOnly: false
  - name: runs-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/runs
      readOnly: false
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

  templates:

  # ── DAG ───────────────────────────────────────────────────────────────────
  # rounds=20, epochs=4, partitions=1,2,3,10,22,24,25,26,28
  # ckpt 경로 형식: agg/R20r{rr}/agg.pt  (FL 규칙: 매 라운드 공유 집계 모델 사용)
  # epoch offset:  r0=0, r1=4, r2=8, ..., r19=76
  - name: stage2
    dag:
      tasks:

      # dry-run: pool+entropy selection (committee = stage1 최종 지역모델)
      - name: dry-run
        template: dry-run-job

      # Round 0: agg/init/agg.pt 에서 시작 (FL 규칙)
      - name: train-r0
        template: train-job
        dependencies: [dry-run]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/init/split.csv"
          - name: round
            value: "0"
          - name: epoch
            value: "0"
          - name: init-ckpt
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/init/agg.pt"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "4"  }
        - { partition: "5"  }
        - { partition: "6"  }
        - { partition: "7"  }
        - { partition: "8"  }
        - { partition: "9"  }
        - { partition: "10" }
        - { partition: "11" }
        - { partition: "12" }
        - { partition: "13" }
        - { partition: "14" }
        - { partition: "15" }
