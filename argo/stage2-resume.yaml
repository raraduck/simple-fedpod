apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fedpod-stage2-resume-
  namespace: dwnkim
spec:
  entrypoint: stage2-resume
  serviceAccountName: default
  podGC:
    strategy: OnPodCompletion

  # ── 파라미터 ──────────────────────────────────────────────────────────────
  # start-round : 재개 시작 라운드 (≥1). start-round=0 은 stage2.yaml 사용.
  # rounds      : 총 라운드 수 2자리 문자열 (예: "20", "05") — 체크포인트 경로에 사용.
  # init-ckpt   : 분기점 agg.pt (이전 실험의 최종 집계 모델).
  # split-csv   : 분기점 split.csv (이전 실험의 최종 split).
  #
  # 동작 원리:
  #   setup  → init-ckpt + split-csv 를 R{rounds}r{start-round-1}/ 에 복사
  #   when   → start-round 미만 라운드는 Skipped (Skipped = 의존성 충족)
  #   실제 학습은 start-round 부터 시작 → 체크포인트 경로가 자연스럽게 연속
  arguments:
    parameters:
    - name: image
      value: "192.168.0.80:30002/dwnkim/argo-fedpod:v0.3"
    - name: job
      value: "stage2-branch"
    - name: start-round
      value: "5"
    - name: rounds
      value: "20"
    - name: init-ckpt
      value: "/checkpoints/stage2-base/agg/R05r04/agg.pt"
    - name: split-csv
      value: "/checkpoints/stage2-base/agg/R05r04/split.csv"
    - name: data-path
      value: "/data/fets128/trainval"
    - name: ckpt-root
      value: "/checkpoints"
    - name: runs-root
      value: "/runs"
    - name: agg-sampling-mode
      value: "dynamic"

  volumes:
  - name: app-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/scripts
      readOnly: true
  - name: data-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/data
      readOnly: true
  - name: experiments-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/experiments
      readOnly: true
  - name: checkpoints-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/checkpoints
      readOnly: false
  - name: runs-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/runs
      readOnly: false
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

  templates:

  # ── DAG ───────────────────────────────────────────────────────────────────
  # epoch offset: r{N} = N × 4
  - name: stage2-resume
    dag:
      tasks:

      # setup: 분기점 체크포인트를 이 job 의 경로 규칙으로 배치
      - name: setup
        template: setup-job

      # ── Round 0 ───────────────────────────────────────────────────────────
      # start-round >= 1 이면 항상 Skipped
      - name: train-r0
        template: train-job
        dependencies: [setup]
        when: "{{workflow.parameters.start-round}} <= 0"
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.split-csv}}"
          - name: round
            value: "0"
          - name: epoch
            value: "0"
          - name: init-ckpt
            value: "{{workflow.parameters.init-ckpt}}"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "10" }
        - { partition: "22" }
        - { partition: "24" }
        - { partition: "25" }
        - { partition: "26" }
        - { partition: "28" }

      - name: eval-r0
        template: eval-job
        dependencies: [setup]
        when: "{{workflow.parameters.start-round}} <= 0"
        arguments:
          parameters:
          - name: split-csv
            value: "{{workflow.parameters.split-csv}}"
          - name: round
            value: "0"
          - name: init-ckpt
            value: "{{workflow.parameters.init-ckpt}}"

      - name: agg-r0
        template: agg-job
        dependencies: [train-r0]
        when: "{{workflow.parameters.start-round}} <= 0"
        arguments:
          parameters:
          - name: split-csv
            value: "{{workflow.parameters.split-csv}}"
          - name: round
            value: "0"

      # ── Round 1 ───────────────────────────────────────────────────────────
      - name: train-r1
        template: train-job
        dependencies: [agg-r0]
        when: "{{workflow.parameters.start-round}} <= 1"
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R{{workflow.parameters.rounds}}r00/split.csv"
          - name: round
            value: "1"
          - name: epoch
            value: "4"
          - name: init-ckpt
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R{{workflow.parameters.rounds}}r00/agg.pt"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "10" }
        - { partition: "22" }
        - { partition: "24" }
        - { partition: "25" }
        - { partition: "26" }
        - { partition: "28" }

      - name: eval-r1
