  # ── Setup Job (init-ckpt + split-csv → R{rounds}r{start-round-1}/ 에 복사) ──
  # GPU 불필요. checkpoints-volume 쓰기 권한만 필요.
  - name: setup-job
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    script:
      image: "{{workflow.parameters.image}}"
      command: [python3]
      source: |
        import os, shutil
        start  = int("{{workflow.parameters.start-round}}")
        rounds = int("{{workflow.parameters.rounds}}")
        base   = "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg"
        src_pt  = "{{workflow.parameters.init-ckpt}}"
        src_csv = "{{workflow.parameters.split-csv}}"
        prev = start - 1
        dest = f"{base}/R{rounds:02d}r{prev:02d}"
        os.makedirs(dest, exist_ok=True)
        shutil.copy2(src_pt,  f"{dest}/agg.pt")
        shutil.copy2(src_csv, f"{dest}/split.csv")
        print(f"setup: {src_pt}  → {dest}/agg.pt")
        print(f"setup: {src_csv} → {dest}/split.csv")
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
      volumeMounts:
      - name: checkpoints-volume
        mountPath: /checkpoints

  # ── Eval Job (generalization — agg.pt 를 모든 기관 val 에 평가) ──────────
  - name: eval-job
    inputs:
      parameters:
      - name: split-csv
      - name: round
      - name: init-ckpt
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu.model
              operator: In
              values:
              - rtx3090
              - rtx4090
    container:
      image: "{{workflow.parameters.image}}"
      command: ["python3", "gen_eval.py"]
      args:
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "-c"
      - "{{inputs.parameters.split-csv}}"
      - "--round"
      - "{{inputs.parameters.round}}"
      - "--rounds"
      - "{{workflow.parameters.rounds}}"
      - "--epochs"
      - "4"
      - "--init-ckpt"
      - "{{inputs.parameters.init-ckpt}}"
      - "-J"
      - "{{workflow.parameters.job}}"
      - "--runs-root"
      - "{{workflow.parameters.runs-root}}"
      - "-C"
      - "[t1,t1ce,t2,flair,seg]"
      - "-G"
      - "[[1,2,4],[1,4],[4]]"
      - "-N"
      - "[wt,tc,et]"
      - "-I"
      - "[1,2,3]"
      - "--gpu"
      - "1"
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: checkpoints-volume
        mountPath: /checkpoints
      - name: runs-volume
        mountPath: /runs
      - name: dshm
        mountPath: /dev/shm

  # ── Train Job (모든 라운드 — FL 규칙: agg.pt 에서 시작) ───────────────────
  - name: train-job
    inputs:
      parameters:
      - name: partition
      - name: split-csv
      - name: round
      - name: epoch
      - name: init-ckpt
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu.model
              operator: In
              values:
              - rtx3090
              - rtx4090
    container:
      image: "{{workflow.parameters.image}}"
      args:
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "-c"
      - "{{inputs.parameters.split-csv}}"
      - "-P"
      - "{{inputs.parameters.partition}}"
      - "-J"
      - "{{workflow.parameters.job}}"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "--rounds"
      - "{{workflow.parameters.rounds}}"
      - "--round"
      - "{{inputs.parameters.round}}"
      - "--epochs"
      - "4"
      - "--epoch"
      - "{{inputs.parameters.epoch}}"
      - "--init-ckpt"
      - "{{inputs.parameters.init-ckpt}}"
      - "-C"
      - "[t1,t1ce,t2,flair,seg]"
      - "-G"
      - "[[1,2,4],[1,4],[4]]"
      - "-N"
      - "[wt,tc,et]"
      - "-I"
      - "[1,2,3]"
      - "--runs-root"
      - "{{workflow.parameters.runs-root}}"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
      - name: runs-volume
        mountPath: /runs
      - name: dshm
        mountPath: /dev/shm

  # ── Agg Job (FedAvg — agg.pt + split CSV 생성) ────────────────────────────
  - name: agg-job
    inputs:
      parameters:
      - name: split-csv
      - name: round
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu.model
              operator: In
              values:
              - rtx3090
              - rtx4090
    container:
      image: "{{workflow.parameters.image}}"
      command: ["python3", "agg.py"]
      args:
      - "-J"
      - "{{workflow.parameters.job}}"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "-c"
      - "{{inputs.parameters.split-csv}}"
      - "--sampling-rate"
      - "1.0"
      - "--sampling-mode"
      - "{{workflow.parameters.agg-sampling-mode}}"
      - "--rounds"
      - "{{workflow.parameters.rounds}}"
      - "--round"
      - "{{inputs.parameters.round}}"
      - "--epochs"
      - "4"
      - "--partitions"
      - "1,2,3,10,22,24,25,26,28"
      - "--runs-root"
      - "{{workflow.parameters.runs-root}}"
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
