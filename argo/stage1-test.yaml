apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fedpod-stage1-test-
  namespace: dwnkim
spec:
  entrypoint: stage1-test
  serviceAccountName: default
  podGC:
    strategy: OnPodCompletion

  # ── 공통 파라미터 ──────────────────────────────────────────────────────────
  arguments:
    parameters:
    - name: image
      value: "192.168.0.80:30002/dwnkim/argo-fedpod:v0.2"
    - name: data-path
      value: "/data/fets128/trainval"
    - name: ckpt-root
      value: "/checkpoints"

  volumes:
  - name: app-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/scripts
      readOnly: true
  - name: data-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/data
      readOnly: true
  - name: experiments-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/experiments
      readOnly: true
  - name: checkpoints-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/checkpoints
      readOnly: false
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

  templates:

  # ── DAG ───────────────────────────────────────────────────────────────────
  - name: stage1-test
    dag:
      tasks:

      # dry-run: init 모델 + R00 split CSV 생성
      - name: dry-run
        template: dry-run-job

      # Round 0: random init, init-ckpt 없음
      - name: train-r0
        template: train-job-r0
        dependencies: [dry-run]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
        withItems:
        - { partition: "1" }
        - { partition: "2" }

      - name: agg-r0
        template: agg-job
        dependencies: [train-r0]
        arguments:
          parameters:
          - name: split-csv
            value: "/checkpoints/stage1/agg/init/split.csv"
          - name: round
            value: "0"

      # Round 1: 각 기관 자신의 R03r00/best.pt 에서 이어서 학습
      - name: train-r1
        template: train-job
        dependencies: [agg-r0]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "/checkpoints/stage1/agg/R03r00/split.csv"
          - name: round
            value: "1"
          - name: epoch
            value: "5"
          - name: init-ckpt
            value: "{{item.ckpt}}"
        withItems:
        - { partition: "1", ckpt: "/checkpoints/stage1/inst01/R03r00/best.pt" }
        - { partition: "2", ckpt: "/checkpoints/stage1/inst02/R03r00/best.pt" }

      - name: agg-r1
        template: agg-job
        dependencies: [train-r1]
        arguments:
          parameters:
          - name: split-csv
            value: "/checkpoints/stage1/agg/R03r00/split.csv"
          - name: round
            value: "1"

      # Round 2: 각 기관 자신의 R03r01/best.pt 에서 이어서 학습
      - name: train-r2
        template: train-job
        dependencies: [agg-r1]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "/checkpoints/stage1/agg/R03r01/split.csv"
          - name: round
            value: "2"
          - name: epoch
            value: "10"
          - name: init-ckpt
            value: "{{item.ckpt}}"
        withItems:
        - { partition: "1", ckpt: "/checkpoints/stage1/inst01/R03r01/best.pt" }
        - { partition: "2", ckpt: "/checkpoints/stage1/inst02/R03r01/best.pt" }

      - name: agg-r2
        template: agg-job
        dependencies: [train-r2]
        arguments:
          parameters:
          - name: split-csv
            value: "/checkpoints/stage1/agg/R03r01/split.csv"
          - name: round
            value: "2"

  # ── Dry-run Job ──────────────────────────────────────────────────────────
  - name: dry-run-job
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    nodeSelector:
      nvidia.com/gpu.model: rtx3090
    container:
      image: "{{workflow.parameters.image}}"
      command: ["python3", "agg.py"]
      args:
      - "--dry-run"
      - "-J"
      - "stage1"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "-c"
      - "/experiments/fets/partition2/fets_split.csv"
      - "--sampling-rate"
      - "1.0"
      - "--sampling-mode"
      - "dynamic"
      - "--selection"
      - "random"
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints

  # ── Train Job — Round 0 (init-ckpt 없음) ─────────────────────────────────
  - name: train-job-r0
    inputs:
      parameters:
      - name: partition
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    nodeSelector:
      nvidia.com/gpu.model: rtx3090
    container:
      image: "{{workflow.parameters.image}}"
      args:
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "-c"
      - "/checkpoints/stage1/agg/init/split.csv"
      - "-P"
      - "{{inputs.parameters.partition}}"
      - "-J"
      - "stage1"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "--rounds"
      - "3"
      - "--round"
      - "0"
      - "-E"
      - "5"
      - "--epoch"
      - "0"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
      - name: dshm
        mountPath: /dev/shm

  # ── Train Job — Round 1+ (init-ckpt = 이전 라운드 inst best.pt) ───────────
  - name: train-job
    inputs:
      parameters:
      - name: partition
      - name: split-csv
      - name: round
      - name: epoch
      - name: init-ckpt
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    nodeSelector:
      nvidia.com/gpu.model: rtx3090
    container:
      image: "{{workflow.parameters.image}}"
      args:
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "-c"
      - "{{inputs.parameters.split-csv}}"
      - "-P"
      - "{{inputs.parameters.partition}}"
      - "-J"
      - "stage1"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "--rounds"
      - "3"
      - "--round"
      - "{{inputs.parameters.round}}"
      - "-E"
      - "5"
      - "--epoch"
      - "{{inputs.parameters.epoch}}"
      - "--init-ckpt"
      - "{{inputs.parameters.init-ckpt}}"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
      - name: dshm
        mountPath: /dev/shm

  # ── Agg Job (split CSV 갱신, agg.pt 미사용) ───────────────────────────────
  - name: agg-job
    inputs:
      parameters:
      - name: split-csv
      - name: round
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    nodeSelector:
      nvidia.com/gpu.model: rtx3090
    container:
      image: "{{workflow.parameters.image}}"
      command: ["python3", "agg.py"]
      args:
      - "-J"
      - "stage1"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "-c"
      - "{{inputs.parameters.split-csv}}"
      - "--sampling-rate"
      - "1.0"
      - "--sampling-mode"
      - "dynamic"
      - "--selection"
      - "random"
      - "--rounds"
      - "3"
      - "--round"
      - "{{inputs.parameters.round}}"
      - "--epochs"
      - "5"
      - "--partitions"
      - "1,2"
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
