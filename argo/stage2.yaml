apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fedpod-stage2-
  namespace: dwnkim
spec:
  entrypoint: stage2
  serviceAccountName: default
  podGC:
    strategy: OnPodCompletion

  # ── 공통 파라미터 ──────────────────────────────────────────────────────────
  arguments:
    parameters:
    - name: image
      value: "192.168.0.80:30002/dwnkim/argo-fedpod:v0.3"
    - name: job
      value: "stage2"
    - name: committee-job
      value: "stage1"
    - name: committee-rounds
      value: "5"
    - name: committee-round
      value: "4"
    - name: committee-partitions
      value: "1,2,3,10,22,24,25,26,28"
    - name: data-path
      value: "/data/fets128/trainval"
    - name: ckpt-root
      value: "/checkpoints"
    - name: runs-root
      value: "/runs"
    - name: selection
      value: "entropy"
    - name: agg-sampling-mode
      value: "dynamic"

  volumes:
  - name: app-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/scripts
      readOnly: true
  - name: data-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/data
      readOnly: true
  - name: experiments-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/experiments
      readOnly: true
  - name: checkpoints-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/checkpoints
      readOnly: false
  - name: runs-volume
    nfs:
      server: 192.168.0.200
      path: /volume1/testfield/GPU_storage/Private_storage/dwnkim/simple-fedpod/runs
      readOnly: false
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

  templates:

  # ── DAG ───────────────────────────────────────────────────────────────────
  # rounds=5, epochs=4, partitions=1,2,3,10,22,24,25,26,28
  # ckpt 경로 형식: agg/R05r{rr}/agg.pt  (FL 규칙: 매 라운드 공유 집계 모델 사용)
  # epoch offset:  r0=0, r1=4, r2=8, r3=12, r4=16
  - name: stage2
    dag:
      tasks:

      # dry-run: pool+entropy selection (committee = stage1 최종 지역모델)
      - name: dry-run
        template: dry-run-job

      # Round 0: agg/init/agg.pt 에서 시작 (FL 규칙)
      - name: train-r0
        template: train-job
        dependencies: [dry-run]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/init/split.csv"
          - name: round
            value: "0"
          - name: epoch
            value: "0"
          - name: init-ckpt
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/init/agg.pt"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "10" }
        - { partition: "22" }
        - { partition: "24" }
        - { partition: "25" }
        - { partition: "26" }
        - { partition: "28" }

      - name: agg-r0
        template: agg-job
        dependencies: [train-r0]
        arguments:
          parameters:
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/init/split.csv"
          - name: round
            value: "0"

      # Round 1: agg/R05r00/agg.pt 에서 시작 (FL 규칙)
      - name: train-r1
        template: train-job
        dependencies: [agg-r0]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r00/split.csv"
          - name: round
            value: "1"
          - name: epoch
            value: "4"
          - name: init-ckpt
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r00/agg.pt"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "10" }
        - { partition: "22" }
        - { partition: "24" }
        - { partition: "25" }
        - { partition: "26" }
        - { partition: "28" }

      - name: agg-r1
        template: agg-job
        dependencies: [train-r1]
        arguments:
          parameters:
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r00/split.csv"
          - name: round
            value: "1"

      # Round 2: agg/R05r01/agg.pt 에서 시작 (FL 규칙)
      - name: train-r2
        template: train-job
        dependencies: [agg-r1]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r01/split.csv"
          - name: round
            value: "2"
          - name: epoch
            value: "8"
          - name: init-ckpt
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r01/agg.pt"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "10" }
        - { partition: "22" }
        - { partition: "24" }
        - { partition: "25" }
        - { partition: "26" }
        - { partition: "28" }

      - name: agg-r2
        template: agg-job
        dependencies: [train-r2]
        arguments:
          parameters:
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r01/split.csv"
          - name: round
            value: "2"

      # Round 3: agg/R05r02/agg.pt 에서 시작 (FL 규칙)
      - name: train-r3
        template: train-job
        dependencies: [agg-r2]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r02/split.csv"
          - name: round
            value: "3"
          - name: epoch
            value: "12"
          - name: init-ckpt
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r02/agg.pt"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "10" }
        - { partition: "22" }
        - { partition: "24" }
        - { partition: "25" }
        - { partition: "26" }
        - { partition: "28" }

      - name: agg-r3
        template: agg-job
        dependencies: [train-r3]
        arguments:
          parameters:
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r02/split.csv"
          - name: round
            value: "3"

      # Round 4: agg/R05r03/agg.pt 에서 시작 (FL 규칙)
      - name: train-r4
        template: train-job
        dependencies: [agg-r3]
        arguments:
          parameters:
          - name: partition
            value: "{{item.partition}}"
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r03/split.csv"
          - name: round
            value: "4"
          - name: epoch
            value: "16"
          - name: init-ckpt
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r03/agg.pt"
        withItems:
        - { partition: "1"  }
        - { partition: "2"  }
        - { partition: "3"  }
        - { partition: "10" }
        - { partition: "22" }
        - { partition: "24" }
        - { partition: "25" }
        - { partition: "26" }
        - { partition: "28" }

      - name: agg-r4
        template: agg-job
        dependencies: [train-r4]
        arguments:
          parameters:
          - name: split-csv
            value: "{{workflow.parameters.ckpt-root}}/{{workflow.parameters.job}}/agg/R05r03/split.csv"
          - name: round
            value: "4"

  # ── Dry-run Job (pool+entropy, GPU 필요) ──────────────────────────────────
  - name: dry-run-job
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu.model
              operator: In
              values:
              - rtx3090
              - rtx4090
    container:
      image: "{{workflow.parameters.image}}"
      command: ["python3", "agg.py"]
      args:
      - "--dry-run"
      - "-J"
      - "{{workflow.parameters.job}}"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "-c"
      - "/experiments/fets/partition2/fets_split.csv"
      - "--sampling-rate"
      - "1.0"
      - "--sampling-mode"
      - "pool"
      - "--selection"
      - "{{workflow.parameters.selection}}"
      - "--in-ch"
      - "5"
      - "--out-classes"
      - "3"
      - "--committee-job"
      - "{{workflow.parameters.committee-job}}"
      - "--committee-rounds"
      - "{{workflow.parameters.committee-rounds}}"
      - "--committee-round"
      - "{{workflow.parameters.committee-round}}"
      - "--committee-partitions"
      - "{{workflow.parameters.committee-partitions}}"
      - "--committee-in-ch"
      - "4"
      - "--committee-out-classes"
      - "1"
      - "--committee-chan"
      - "[t1,t1ce,t2,flair]"
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "--gpu"
      - "1"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints

  # ── Train Job (모든 라운드 — FL 규칙: agg.pt 에서 시작) ───────────────────
  - name: train-job
    inputs:
      parameters:
      - name: partition
      - name: split-csv
      - name: round
      - name: epoch
      - name: init-ckpt
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu.model
              operator: In
              values:
              - rtx3090
              - rtx4090
    container:
      image: "{{workflow.parameters.image}}"
      args:
      - "-D"
      - "{{workflow.parameters.data-path}}"
      - "-c"
      - "{{inputs.parameters.split-csv}}"
      - "-P"
      - "{{inputs.parameters.partition}}"
      - "-J"
      - "{{workflow.parameters.job}}"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "--rounds"
      - "5"
      - "--round"
      - "{{inputs.parameters.round}}"
      - "--epochs"
      - "4"
      - "--epoch"
      - "{{inputs.parameters.epoch}}"
      - "--init-ckpt"
      - "{{inputs.parameters.init-ckpt}}"
      - "-C"
      - "[t1,t1ce,t2,flair,seg]"
      - "-G"
      - "[[1,2,4],[1,4],[4]]"
      - "-N"
      - "[wt,tc,et]"
      - "-I"
      - "[1,2,3]"
      - "--runs-root"
      - "{{workflow.parameters.runs-root}}"
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: data-volume
        mountPath: /data
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
      - name: runs-volume
        mountPath: /runs
      - name: dshm
        mountPath: /dev/shm

  # ── Agg Job (FedAvg — agg.pt + split CSV 생성) ────────────────────────────
  - name: agg-job
    inputs:
      parameters:
      - name: split-csv
      - name: round
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: nvidia.com/gpu.model
              operator: In
              values:
              - rtx3090
              - rtx4090
    container:
      image: "{{workflow.parameters.image}}"
      command: ["python3", "agg.py"]
      args:
      - "-J"
      - "{{workflow.parameters.job}}"
      - "--ckpt-root"
      - "{{workflow.parameters.ckpt-root}}"
      - "-c"
      - "{{inputs.parameters.split-csv}}"
      - "--sampling-rate"
      - "1.0"
      - "--sampling-mode"
      - "{{workflow.parameters.agg-sampling-mode}}"
      - "--rounds"
      - "5"
      - "--round"
      - "{{inputs.parameters.round}}"
      - "--epochs"
      - "4"
      - "--partitions"
      - "1,2,3,10,22,24,25,26,28"
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      volumeMounts:
      - name: app-volume
        mountPath: /app
      - name: experiments-volume
        mountPath: /experiments
      - name: checkpoints-volume
        mountPath: /checkpoints
